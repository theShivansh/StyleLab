name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# There is no demo mode. Test jobs inject stub adapters (test doubles for an external
# dependency) and never need a key; the live-smoke job below is the only one that does.
# See docs/DECISIONS.md — demo mode removed.

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test:unit
      - run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "apps/api[dev]"
      - run: ruff check apps/api tests
      - run: pytest apps/api/tests -q

  ai-eval:
    runs-on: ubuntu-latest
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "apps/api[dev]"
      - name: Grounding regression (stub adapters, no API key)
        run: pytest tests/ai -q
      - name: Agent ablation (each role must change the output)
        run: pytest tests/ai/test_ablation.py -q

  e2e:
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e -- --grep @critical
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/ }

  # Real Groq calls. main only — fork PRs cannot read secrets, and this costs tokens.
  # Asserts the configured model IDs still resolve and still satisfy the schema.
  live-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ai-eval]
    env:
      # The key only. Model ids are NOT pinned here: CLAUDE.md allows them in exactly two
      # places, and these three lines were a silently diverging third — they *override* the
      # configured defaults, so a model change in app/config.py would have left CI checking
      # the availability of the old ids and reporting green. Removed in S6, and
      # apps/api/tests/test_adapter_boundary.py now fails if they come back.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "apps/api[dev]"
      - name: Model availability check
        run: pytest tests/live/test_model_availability.py -q
      - name: One real extraction + one real composition
        run: pytest tests/live -q -m smoke
