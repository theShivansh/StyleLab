[project]
name = "stylelab-api"
version = "0.1.0"
description = "STYLELAB API — wardrobe extraction and outfit composition."
requires-python = ">=3.11,<3.13"
dependencies = [
    # The only vendor SDK, confined to app/adapters/groq_transport.py by
    # tests/test_adapter_boundary.py. Floor rather than pin: Groq ships often and the
    # surface we use (chat.completions, models.list, the typed exceptions) is stable.
    "groq>=0.30",
    # The agent framework, confined to app/adapters/crew*.py. Its LLM calls are routed
    # through our own ChatTransport via `crewai.BaseLLM` rather than LiteLLM, so the crew is
    # testable with no API key — see app/adapters/crew_llm.py for why that mattered enough
    # to be worth a custom LLM class. Floor with a ceiling: CrewAI moves fast and BaseLLM's
    # signature has changed within 1.x.
    "crewai>=1.15,<2",
    # Exa is reached over plain HTTP from app/adapters/exa_search.py — the endpoint is one
    # POST and the SDK would buy a second opinion about what a timeout means. httpx was
    # already here transitively; naming it makes the dependency honest.
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Upper bound added in S12, by the release review, and it is not cosmetic. `crewai`
    # declares `pydantic<2.13,>=2.11.9`. This machine had 2.13.5 — installed by an emergency
    # repair in S8b when a collided install left pydantic and pydantic-core mismatched — and
    # a floor of `>=2.9` let it stay. So every local test run was green against a version the
    # agent framework says it does not support, while CI and any clean `pip install` resolved
    # 2.12.x. Two green stacks, neither of them the other, and a container would have shipped
    # a third.
    #
    # Pinned to the range crewai actually supports so that local, CI and the deployed image
    # agree about what was tested. Revisit when crewai widens it.
    "pydantic>=2.11.9,<2.13",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    # The Postgres driver. Added in S12, by trying to deploy: `docs/DEPLOYMENT.md` has told
    # operators to set `DATABASE_URL=postgresql+psycopg://…` since S11 and nothing installed
    # anything that could open one. The container would have built for eight minutes and
    # then failed at boot on `ModuleNotFoundError: No module named 'psycopg'` — a deployment
    # instruction and a dependency list that had never been in the same room.
    #
    # `[binary]` rather than plain: it ships a wheel with libpq inside, so the image needs no
    # Postgres development headers and the build does not depend on what the base image
    # happens to carry.
    "psycopg[binary]>=3.2",
    # Migrations (blocker B12, closed in S11). A runtime dependency rather than a dev one:
    # `alembic upgrade head` is a deploy step, so the image that runs the API is the image
    # that has to be able to run it.
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    # Image ingest: decode, EXIF strip, downscale. Floor not pin, and 11.3 is the floor
    # because AVIF decoding arrived there and the upload allow-list offers AVIF.
    "pillow>=11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by `alembic revision --autogenerate` and regenerated that way every time. Each
# new migration would otherwise need hand-reformatting to satisfy rules it was never written
# against — a chore with no reader, attached to the one kind of file that should be reviewed
# for what it does to a database rather than for its line lengths. `migrations/env.py` is
# hand-written and stays linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["smoke: live-provider smoke tests, main branch only"]
