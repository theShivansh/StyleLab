# Alembic configuration — blocker B12, closed in S11.
#
# Run from `apps/api`:
#
#   alembic upgrade head                  apply everything outstanding
#   alembic upgrade head --sql            print the SQL instead, for review
#   alembic revision --autogenerate -m "…"  draft a migration from the models
#   alembic downgrade -1                  step back one
#
# There is deliberately **no URL here.** The generated template puts one in this file, which
# makes it the second place that names the database — and the one nobody updates, so a
# migration ends up running against a developer's SQLite file while the application talks to
# Postgres. `migrations/env.py` reads `app.config.Settings.resolved_database_url` instead, so
# `DATABASE_URL` means the same thing here as everywhere else. Override for a one-off with
# `alembic -x url=postgresql+psycopg://… upgrade head`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
